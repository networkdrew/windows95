<!-- Hotmail sign-up form. Purely local/fake: submitting this only writes a
     record to this browser's own localStorage (see STORE_KEY below) -- it
     is never sent anywhere. Nothing here is a real account. -->
<html>
<head>
<title>Hotmail - Sign Up</title>
<style>
  body { background:#fff; font-family: Arial, Helvetica, sans-serif; color:#000; margin:0; }
  .hm-wrap { max-width: 560px; margin: 0 auto; padding: 18px; }
  .hm-logo { font-size: 32px; font-weight: bold; font-style: italic; color: #003399; letter-spacing: -1px; }
  .hm-box { border: 1px solid #003399; margin-top: 16px; }
  .hm-box-head { background:#003399; color:#fff; font-weight:bold; padding:3px 8px; font-size:13px; }
  .hm-box-body { padding: 10px; font-size:13px; }
  .hm-box-body td { padding: 3px 6px 3px 0; }
  .hm-box-body input[type=text], .hm-box-body input[type=password] { border:1px solid #808080; padding:2px; font-size:13px; }
  .hm-error { color:#cc0000; font-weight:bold; font-size:12px; margin-top:6px; }
  .hm-note { font-size:11px; color:#555; margin-top:14px; }
</style>
</head>
<body>
<div class="hm-wrap">
  <div class="hm-logo">Hotmail</div>
  <div class="hm-box">
    <div class="hm-box-head">Create Your Free Account</div>
    <div class="hm-box-body">
      <form id="hm-signup-form" onsubmit="return hmSignup(event)">
        <table border="0" cellspacing="0">
          <tr><td>First Name:</td><td><input type="text" id="hm-first" size="20"></td></tr>
          <tr><td>Last Name:</td><td><input type="text" id="hm-last" size="20"></td></tr>
          <tr><td>Desired Member Name:</td><td><input type="text" id="hm-name" size="16" maxlength="16"> @hotmail.com</td></tr>
          <tr><td>Password:</td><td><input type="password" id="hm-pass1" size="16" maxlength="16"></td></tr>
          <tr><td>Password Again:</td><td><input type="password" id="hm-pass2" size="16" maxlength="16"></td></tr>
        </table>
        <br>
        <input type="submit" value="Sign Up">
        <div class="hm-error" id="hm-signup-error"></div>
      </form>
    </div>
  </div>
  <p class="hm-note">
    Nothing you enter here is sent anywhere -- this demo account lives only
    in your own browser (localStorage) and disappears if you clear site
    data. <a href="index.html">Back to Sign In</a>
  </p>
</div>

<script>
  const STORE_KEY = "win95_hotmail_accounts";

  function hmLoadAccounts() {
    let accounts;
    try { accounts = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch (e) { accounts = null; }
    if (!accounts) accounts = { demo: { password: "demo123", first: "Demo", last: "User" } };
    return accounts;
  }

  function hmSignup(e) {
    e.preventDefault();
    const err = document.getElementById("hm-signup-error");
    const name = document.getElementById("hm-name").value.trim().toLowerCase();
    const pass1 = document.getElementById("hm-pass1").value;
    const pass2 = document.getElementById("hm-pass2").value;
    const first = document.getElementById("hm-first").value.trim();
    const last = document.getElementById("hm-last").value.trim();

    if (!/^[a-z0-9_.]{1,16}$/.test(name)) {
      err.textContent = "Please choose a Member Name using only letters, numbers, dots or underscores.";
      return false;
    }
    if (pass1.length < 4) {
      err.textContent = "Please choose a password at least 4 characters long.";
      return false;
    }
    if (pass1 !== pass2) {
      err.textContent = "Your passwords didn't match. Please try again.";
      return false;
    }

    const accounts = hmLoadAccounts();
    if (accounts[name]) {
      err.textContent = "That Member Name is already taken. Please choose another.";
      return false;
    }
    accounts[name] = { password: pass1, first: first, last: last };
    try { localStorage.setItem(STORE_KEY, JSON.stringify(accounts)); } catch (e) {}
    try { sessionStorage.setItem("win95_hotmail_user", name); } catch (e) {}
    location.href = "inbox.html?welcome=1";
    return false;
  }
</script>
</body>
</html>
